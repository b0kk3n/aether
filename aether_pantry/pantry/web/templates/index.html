<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Aether Pantry - what's low or out at home, so it doesn't have to live in your head.">

  <title>Aether Pantry</title>

  <link rel="manifest" href="static/manifest.json">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <div class="app">
    <div class="app-content" id="app-content">
      <div class="loading">Loading...</div>
    </div>

    <nav class="bottom-nav">
      <a href="#grocery" class="nav-item active" data-view="grocery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Grocery</span>
      </a>
      <a href="#products" class="nav-item" data-view="products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8l-9-5-9 5 9 5 9-5z"></path>
          <path d="M3 8v8l9 5 9-5V8"></path>
          <line x1="12" y1="13" x2="12" y2="21"></line>
        </svg>
        <span>Products</span>
      </a>
      <a href="#checklists" class="nav-item" data-view="checklists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="2"></rect>
          <rect x="9" y="1.5" width="6" height="3" rx="1"></rect>
          <line x1="9" y1="11" x2="15" y2="11"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span>Checklists</span>
      </a>
    </nav>
  </div>

  <script src="static/js/app.js"></script>
</body>
</html>

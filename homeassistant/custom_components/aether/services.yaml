complete_chore:
  description: Mark a chore as complete in Aether.
  fields:
    chore_id:
      description: The ID of the chore to complete.
      required: true
      example: "abc123"

what_now:
  description: Ask Aether what to do given available time. Fires an aether_what_now event with suggestions.
  fields:
    minutes:
      description: How many minutes are available.
      required: false
      example: 30

# fly.toml app configuration file generated for aether-dm-rmq on 2026-02-06T10:31:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aether-dm-rmq'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile.flyio"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

name: Aether Pantry
version: "0.1.1"
slug: aether_pantry
description: "What's low or out at home, so it doesn't have to live in your head."
url: "https://github.com/b0kk3n/aether"
arch:
  - aarch64
  - armv7
  - amd64
startup: application
boot: auto
init: false

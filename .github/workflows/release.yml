name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number (e.g. 0.4.2)"
        required: true
        type: string
      title:
        description: "Release title (e.g. Fix dashboard refresh bug)"
        required: true
        type: string
      description:
        description: "What changed — will appear in CHANGELOG.md"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and update CHANGELOG
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TITLE: ${{ github.event.inputs.title }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: python3 scripts/bump_version.py

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            config.yaml \
            pyproject.toml \
            aether/__init__.py \
            homeassistant/custom_components/aether/manifest.json \
            CHANGELOG.md
          git commit -m "Release v${{ github.event.inputs.version }}: ${{ github.event.inputs.title }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main
          git push origin "v${{ github.event.inputs.version }}"
